name: Auto Organize LeetCode Questions

on:
  push:
    branches:
      - main
    paths:
      - '[0-9][0-9][0-9][0-9]-**'
      - 'README.md'
      - 'stats.json'

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    # Prevent infinite loop if committed by github-actions
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Question Organizer
        run: |
          python3 scripts/organize.py

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Auto-organize new LeetCode questions by topic [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
