name: Auto Organize LeetCode Questions

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
  workflow_dispatch:
    inputs:
      multi_approach:
        description: 'Preserve multiple approaches in separate files'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: organize-questions
  cancel-in-progress: false

jobs:
  organize:
    runs-on: ubuntu-latest
    # Prevent infinite loop if committed by github-actions
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Question Organizer
        env:
          MULTI_APPROACH: ${{ inputs.multi_approach || 'true' }}
        run: |
          python3 scripts/organize.py

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Auto-organize LeetCode questions and multi-approach solutions [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi
