name: Update LeetCode Progress

on:
  push:
    paths:
      - '**/*.cpp'
      - '**/*.cc'
      - '**/*.cxx'
      - '**/*.c'
      - '**/*.py'
      - '**/*.java'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.go'
      - '**/*.rs'
      - '**/*.kt'
      - '**/*.cs'
      - '**/*.swift'
      - '**/*.rb'
      - '**/*.scala'
      - '**/*.php'
      - '**/README.md'
      - 'neetcode150.json'
      - '.github/workflows/organize.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leetcode-progress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  organize:
    # Follow the repository's configured default branch, including after renames.
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate tracker
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -v

      - name: Refresh README
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 organize.py

      - name: Commit generated README only
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already current."
            exit 0
          fi
          git diff -- README.md > readme-update.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md
          git commit -m "docs: refresh LeetCode progress [skip ci]"
          # Never force-push or rebase over newer work. A concurrent push fails safely.
          if ! git push origin "HEAD:$TARGET_BRANCH"; then
            echo '::error::README push rejected. Check branch protection, token write access, or a concurrent push. Download the generated patch artifact or rerun after resolving the restriction.'
            exit 1
          fi

      - name: Preserve README patch if publishing fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: readme-update
          path: readme-update.patch
          if-no-files-found: ignore
